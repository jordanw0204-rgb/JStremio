<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0c0919">
  <title>JStremio Remote</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header><div class="brand"><span>J</span><div><strong>JStremio</strong><small>Phone Remote</small></div></div><span class="connection" data-connection>Connecting</span></header>
    <section class="now-playing" aria-live="polite">
      <p class="eyebrow">Now playing</p>
      <h1 data-title>Nothing playing</h1>
      <p data-subtitle>Start a video in JStremio.</p>
    </section>
    <section class="scrubber" aria-label="Playback position">
      <input type="range" min="0" max="1" value="0" step="1000" data-seek disabled aria-label="Seek position">
      <div><time data-position>00:00</time><time data-duration>00:00</time></div>
    </section>
    <section class="transport" aria-label="Playback controls">
      <button type="button" data-seek-by="-30000" aria-label="Seek backward 30 seconds"><span>−30</span><small>seconds</small></button>
      <button type="button" class="play" data-play aria-label="Play or pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path data-play-icon d="M8 5v14l11-7z"/></svg></button>
      <button type="button" data-seek-by="30000" aria-label="Seek forward 30 seconds"><span>+30</span><small>seconds</small></button>
    </section>
    <section class="quick" aria-label="Quick seek controls"><button type="button" data-seek-by="-10000">−10s</button><button type="button" data-seek-by="10000">+10s</button></section>
    <section class="volume"><button type="button" data-mute aria-label="Mute">Sound</button><input type="range" min="0" max="100" value="50" step="1" data-volume disabled aria-label="Volume"><output data-volume-label>50%</output></section>
    <section class="notice" data-notice hidden><strong data-notice-title>Pairing required</strong><p data-notice-message>Scan a new code from JStremio.</p></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
