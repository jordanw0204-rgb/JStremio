[package]
name = "jstremio-updater"
version = "1.8.0"
edition = "2021"
publish = false

[[bin]]
name = "JStremioUpdater"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
ureq = { version = "3.3.0", features = ["json"] }
url = "2"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "winerror",
    "winuser",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[workspace]
